<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Evren & Güneş Sistemi Simülasyonu - Eren Yıldız</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010206; color: #fff; }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; transition: all 0.3s ease; }

        .header-title {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(8, 10, 20, 0.92); backdrop-filter: blur(25px);
            padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); pointer-events: auto; max-width: 240px;
        }
        .header-title h1 { font-size: 15px; font-weight: 600; background: linear-gradient(90deg, #ff9d00, #ff4500, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-title p { font-size: 10.5px; color: #aaa; margin-top: 2px; }

        /* Oluşturucu İmzası CSS Ayarları */
        .creator-signature {
            position: absolute; z-index: 12;
            background: rgba(8, 10, 20, 0.85); backdrop-filter: blur(15px);
            padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 11.5px; color: #00d2ff; font-weight: 600; letter-spacing: 0.5px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6); pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Windows Modunda Eskisi Gibi Tam Sağ Altta */
        body.mode-win .creator-signature {
            display: block;
            bottom: 20px;
            right: 25px;
            left: auto;
            transform: none;
        }

        /* Android / Tablet Modunda Alt Menünün Üstünde Ortalanmış */
        body.mode-and .creator-signature {
            display: block;
            bottom: 78px;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
        }

        .top-controls {
            position: absolute; top: 20px; right: 25px; z-index: 15;
            display: flex; align-items: center; gap: 10px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end;
            transition: all 0.3s ease;
        }

        .settings-container { position: relative; display: inline-block; }
        .settings-icon-btn {
            background: rgba(8, 10, 20, 0.9); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: all 0.2s;
        }
        .settings-icon-btn:hover { background: #0078d4; border-color: #60cdff; transform: scale(1.05); }

        .mode-dropdown {
            position: absolute; top: 48px; right: 0; background: rgba(10, 12, 24, 0.96);
            backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px;
            padding: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); display: none; flex-direction: column; gap: 8px; z-index: 30; min-width: 170px;
        }
        .mode-dropdown.show { display: flex; }
        .mode-dropdown span { font-size: 11px; color: #aaa; font-weight: 600; margin-bottom: 2px; }
        .mode-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #ccc;
            padding: 6px 12px; border-radius: 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .mode-btn.active { background: #0078d4; color: #fff; border-color: #60cdff; }

        /* Yazılı Yörünge Butonu */
        .orbit-toggle-btn {
            background: rgba(8, 10, 20, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #60cdff; padding: 8px 16px; border-radius: 25px;
            display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: all 0.25s ease; white-space: nowrap;
        }
        .orbit-toggle-btn:hover { background: #0078d4; color: #fff; border-color: #60cdff; transform: translateY(-2px); }
        .orbit-toggle-btn.off { color: #aaa; border-color: rgba(255,255,255,0.15); background: rgba(8, 10, 20, 0.6); }

        .align-btn {
            background: linear-gradient(135deg, #0078d4, #005a9e); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 9px 16px; border-radius: 25px; font-size: 12px; font-weight: 600;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0,120,212,0.5); transition: all 0.25s ease;
            display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .align-btn:hover { background: linear-gradient(135deg, #1084e3, #006cc1); transform: translateY(-2px); }

        .speed-control {
            background: rgba(8, 10, 20, 0.9); backdrop-filter: blur(20px);
            padding: 8px 16px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; gap: 8px; font-size: 12px; color: #ccc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .speed-control input { accent-color: #0078d4; cursor: pointer; width: 75px; }

        /* Sabit Alt Gezegen Menüsü */
        .planet-nav {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(12, 15, 30, 0.94); backdrop-filter: blur(25px);
            padding: 8px 18px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.22);
            display: flex; gap: 6px; align-items: center; box-shadow: 0 15px 45px rgba(0,0,0,0.85); max-width: 95vw; overflow-x: auto;
        }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: #ccc;
            padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .nav-btn.active { background: #0078d4; color: #fff; border-color: #60cdff; box-shadow: 0 0 15px rgba(0,120,212,0.7); }
        .nav-btn.reset-btn { background: rgba(255, 157, 0, 0.2); border-color: #ff9d00; color: #ffcc00; }
        .nav-btn.reset-btn:hover { background: #ff9d00; color: #000; }
        .nav-btn.deepspace-btn { background: rgba(147, 51, 234, 0.25); border-color: #a855f7; color: #d8b4fe; }
        .nav-btn.deepspace-btn:hover { background: #9333ea; color: #fff; }

        /* Bilgi Kartı */
        .info-card {
            position: absolute; top: 95px; width: 380px; height: 440px; max-height: calc(100vh - 150px);
            background: rgba(10, 12, 24, 0.96); backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 18px; padding: 20px;
            z-index: 20; box-shadow: 0 25px 60px rgba(0,0,0,0.9); display: flex; flex-direction: column;
            opacity: 0; transition: all 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            pointer-events: auto;
        }
        body.mode-win .info-card { right: 25px; left: auto; transform: translateX(420px); }
        body.mode-win .info-card.open { transform: translateX(0); opacity: 1; }

        body.mode-and .info-card { left: 25px; right: auto; transform: translateX(-420px); }
        body.mode-and .info-card.open { transform: translateX(0); opacity: 1; }

        .info-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 6px; flex-shrink: 0; }
        .info-card-header h2 { font-size: 19px; font-weight: 600; color: #fff; }
        .close-btn { background: transparent; border: none; color: #aaa; font-size: 18px; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: #ff5555; }

        .info-type { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #00d2ff; letter-spacing: 1px; margin-bottom: 4px; flex-shrink: 0; }
        .info-desc { font-size: 11.5px; color: #ddd; line-height: 1.35; margin-bottom: 10px; flex-shrink: 0; }

        .audio-btn {
            background: linear-gradient(135deg, #9333ea, #6b21a8); color: #fff; border: none;
            padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer;
            width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.4); flex-shrink: 0; transition: transform 0.2s;
        }
        .audio-btn:hover { transform: scale(1.02); }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; flex-shrink: 0; }
        .stat-box { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 6px 8px; border-radius: 8px; }
        .stat-label { font-size: 9.5px; color: #aaa; margin-bottom: 2px; }
        .stat-value { font-size: 11.5px; font-weight: 600; color: #60cdff; }

        .moons-title { font-size: 11.5px; font-weight: 600; margin-bottom: 4px; color: #ffcc00; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        
        .moons-list-container { flex-grow: 1; overflow-y: auto; padding-right: 4px; }
        .moons-list { display: flex; flex-wrap: wrap; gap: 4px; }
        .moon-chip { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 3px 8px; border-radius: 8px; font-size: 10px; color: #eee; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
    </style>
</head>
<body class="mode-win">

    <div id="canvas-container"></div>

    <div class="header-title">
        <h1>3D Evren & Güneş Sistemi</h1>
        <p>293 Uydu & Gezegen Simülasyonu</p>
    </div>

    <!-- İmza Metni -->
    <div class="creator-signature">Created by Eren Yıldız</div>

    <div class="top-controls" id="topControls">
        <!-- Ayarlar Butonu -->
        <div class="settings-container">
            <button class="settings-icon-btn" onclick="toggleSettingsMenu()" title="Mod Ayarları"><i class="fa-solid fa-gear"></i></button>
            <div class="mode-dropdown" id="modeDropdown">
                <span>Cihaz Modu:</span>
                <button class="mode-btn active" id="btnWin" onclick="setDeviceMode('windows')"><i class="fa-solid fa-desktop"></i> Windows</button>
                <button class="mode-btn" id="btnAnd" onclick="setDeviceMode('android')"><i class="fa-solid fa-tablet-screen-button"></i> Android / Tablet</button>
            </div>
        </div>

        <!-- Yörünge Gizle/Göster Butonu -->
        <button class="orbit-toggle-btn" id="orbitToggleBtn" onclick="toggleOrbits()">
            <i class="fa-solid fa-orbit"></i> <span id="orbitStatusText">Yörüngeler: Açık</span>
        </button>

        <button class="align-btn" onclick="toggleAlignment()"><i class="fa-solid fa-arrows-to-dot"></i> Gezegenleri Hizala</button>
        
        <div class="speed-control">
            <i class="fa-solid fa-gauge-high"></i> Hız:
            <input type="range" id="speedSlider" min="0" max="2" step="0.01" value="0.3">
            <span id="speedValueDisplay" style="color:#60cdff; font-weight:600; width:35px;">0.3x</span>
        </div>
    </div>

    <!-- Sabit Alt Gezegen Menüsü -->
    <div class="planet-nav" id="planetNav">
        <button class="nav-btn reset-btn" onclick="resetToCenter()"><i class="fa-solid fa-arrows-to-eye"></i> Güneş'i Ortala</button>
        <button class="nav-btn active" onclick="focusObject('Sun')"><i class="fa-solid fa-sun" style="color:#ffcc00;"></i> Güneş</button>
        <button class="nav-btn" onclick="focusObject('Mercury')">Merkür</button>
        <button class="nav-btn" onclick="focusObject('Venus')">Venüs</button>
        <button class="nav-btn" onclick="focusObject('Earth')">Dünya</button>
        <button class="nav-btn" onclick="focusObject('Mars')">Mars</button>
        <button class="nav-btn" onclick="focusObject('AsteroidBelt')">Kuşak</button>
        <button class="nav-btn" onclick="focusObject('Jupiter')">Jüpiter</button>
        <button class="nav-btn" onclick="focusObject('Saturn')">Satürn</button>
        <button class="nav-btn" onclick="focusObject('Uranus')">Uranüs</button>
        <button class="nav-btn" onclick="focusObject('Neptune')">Neptün</button>
        <button class="nav-btn deepspace-btn" onclick="focusObject('Gargantua')"><i class="fa-solid fa-circle-dot"></i> Kara Delik</button>
        <button class="nav-btn deepspace-btn" onclick="focusObject('NeutronStar')"><i class="fa-solid fa-compact-disc"></i> Nötron Yıldızı</button>
        <button class="nav-btn deepspace-btn" onclick="focusObject('MilkyWay')"><i class="fa-solid fa-galaxy"></i> Samanyolu</button>
        <button class="nav-btn deepspace-btn" onclick="focusObject('Andromeda')"><i class="fa-solid fa-hurricane"></i> Andromeda</button>
    </div>

    <div class="info-card" id="infoCard">
        <div class="info-card-header">
            <h2 id="cardTitle">Güneş</h2>
            <button class="close-btn" onclick="closeInfoCard()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="info-type" id="cardType">Sarı Cüce Yıldız</div>
        
        <button id="audioControlBtn" class="audio-btn" style="display:none;" onclick="togglePulsarSound()">
            <i class="fa-solid fa-volume-high"></i> Pulsar Sesini Dinle (Radyo Dalgası)
        </button>

        <p class="info-desc" id="cardDesc">Açıklama yükleniyor...</p>

        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">Boyut / Çap</div><div class="stat-value" id="statRadius">-</div></div>
            <div class="stat-box"><div class="stat-label">Merkeze Uzaklık</div><div class="stat-value" id="statDist">-</div></div>
            <div class="stat-box"><div class="stat-label">Sıcaklık / Alan</div><div class="stat-value" id="statDayTemp">-</div></div>
            <div class="stat-box"><div class="stat-label">Dönüş / Özellik</div><div class="stat-value" id="statNightTemp">-</div></div>
            <div class="stat-box"><div class="stat-label">Hız / Süre</div><div class="stat-value" id="statDay">-</div></div>
            <div class="stat-box"><div class="stat-label">Sınıflandırma</div><div class="stat-value" id="statTilt">-</div></div>
        </div>

        <div class="moons-title" id="moonsTitleHeader"><i class="fa-solid fa-moon"></i> <span id="sectionSubTitle">Uydu Listesi</span> (<span id="moonCountDisplay">0</span>)</div>
        <div class="moons-list-container">
            <div class="moons-list" id="moonsList"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

            document.getElementById('modeDropdown').classList.toggle('show');

            deviceMode = mode;
            document.body.className = (mode === 'windows') ? 'mode-win' : 'mode-and';
            document.getElementById('btnWin').classList.toggle('active', mode === 'windows');
            document.getElementById('btnAnd').classList.toggle('active', mode === 'android');
            document.getElementById('modeDropdown').classList.remove('show');
            
            if (selectedObject) {
                focusObject(selectedObject);
            }
        }

            orbitsVisible = !orbitsVisible;
            const btn = document.getElementById('orbitToggleBtn');
            const txt = document.getElementById('orbitStatusText');
            
            btn.classList.toggle('off', !orbitsVisible);

            ctx.fillStyle = '#226b34';
            ctx.beginPath(); ctx.ellipse(260, 180, 90, 60, 0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(320, 320, 70, 100, -0.3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(600, 160, 150, 80, -0.1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(580, 300, 80, 90, 0.1, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f0f9ff'; ctx.fillRect(0, 0, 1024, 30); ctx.fillRect(0, 480, 1024, 32);
            return new THREE.CanvasTexture(canvas);
        }

            for(let i=0; i<45; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*1024, Math.random()*512, 30 + Math.random()*60, 0, Math.PI*2);

            return new THREE.CanvasTexture(canvas);

        let audioCtx = null, isAudioPlaying = false, audioInterval = null;
        function togglePulsarSound() {
            if (!isAudioPlaying) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    isAudioPlaying = true;
                    document.getElementById('audioControlBtn').innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Sesi Kapat';
                    audioInterval = setInterval(() => {
                        if (!isAudioPlaying || !audioCtx) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(); osc.stop(audioCtx.currentTime + 0.09);
                    }, 140);
                } catch(e) {}
            } else { stopPulsarSound(); }
        }

        function stopPulsarSound() {
            isAudioPlaying = false;
            if (audioInterval) clearInterval(audioInterval);
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            const btn = document.getElementById('audioControlBtn');
            if (btn) btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Pulsar Sesini Dinle (Radyo Dalgası)';
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let mouseDownPos = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            mouseDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if(e.target.closest('#infoCard') || e.target.closest('#planetNav') || e.target.closest('.header-title') || e.target.closest('.top-controls')) return;

            const deltaX = Math.abs(e.clientX - mouseDownPos.x);
            const deltaY = Math.abs(e.clientY - mouseDownPos.y);
            if (deltaX > 5 || deltaY > 5) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const allMeshes = Object.values(celestialObjects).map(o => o.mesh);
            const intersects = raycaster.intersectObjects(allMeshes, true);

            if(intersects.length > 0) {
                let obj = intersects[0].object;
                while(obj && !obj.name && obj.parent) obj = obj.parent;
                if(obj && obj.name && celestialObjects[obj.name]) {
                    focusObject(obj.name);
                } else {
                    for(let key in celestialObjects) {
                        if(celestialObjects[key].mesh === intersects[0].object || celestialObjects[key].mesh.children.includes(intersects[0].object)) {
                            focusObject(key);
                            break;
                        }
                    }
                }
            }
        });

        function focusObject(name) {
            selectedObject = name;
            const target = celestialObjects[name];
            if(!target) return;

            if (name !== 'NeutronStar') stopPulsarSound();

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(celestialData[name]?.name.split(' ')[0] || name));
            });

            const worldPos = new THREE.Vector3();
            if(name === "AsteroidBelt" && target.centerAnchor) {
                target.centerAnchor.getWorldPosition(worldPos);
            } else if(target.mesh) {
                target.mesh.getWorldPosition(worldPos);
            }

            const baseOffset = (target.size || 15) * 3.5 + 20;
            const targetCamPos = new THREE.Vector3(worldPos.x + baseOffset, worldPos.y + baseOffset * 0.35, worldPos.z + baseOffset);
            const targetLookAt = worldPos;

            new TWEEN.Tween(camera.position).to(targetCamPos, 2200).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to(targetLookAt, 2200).easing(TWEEN.Easing.Cubic.Out).start();

            openInfoCard(name);
        }

        function openInfoCard(name) {
            const data = celestialData[name] || { name: name, type: "Gök Cismi", radius: "-", distance: "-", dayTemp: "-", nightTemp: "-", day: "-", tilt: "-", desc: "Bilgi bulunamadı.", moons: [], hasAudio: false };

            document.getElementById('cardTitle').innerText = data.name;
            document.getElementById('cardType').innerText = data.type;
            document.getElementById('cardDesc').innerText = data.desc;
            document.getElementById('statRadius').innerText = data.radius;
            document.getElementById('statDist').innerText = data.distance;
            document.getElementById('statDayTemp').innerText = data.dayTemp;
            document.getElementById('statNightTemp').innerText = data.nightTemp;
            document.getElementById('statDay').innerText = data.day;
            document.getElementById('statTilt').innerText = data.tilt;
            document.getElementById('sectionSubTitle').innerText = data.listTitle || "Uydular";
            document.getElementById('moonCountDisplay').innerText = data.moons.length;

            const audioBtn = document.getElementById('audioControlBtn');
            if (data.hasAudio) audioBtn.style.display = 'flex';
            else { audioBtn.style.display = 'none'; stopPulsarSound(); }

            const moonListEl = document.getElementById('moonsList');
            moonListEl.innerHTML = '';
            data.moons.forEach(m => {
                const chip = document.createElement('div');
                chip.className = 'moon-chip';
                chip.innerText = m;
                moonListEl.appendChild(chip);
            });

            document.getElementById('infoCard').classList.add('open');
        }

        function closeInfoCard() {
            stopPulsarSound();
            document.getElementById('infoCard').classList.remove('open');
            
            selectedObject = null;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            new TWEEN.Tween(camera.position).to({ x: 0, y: 220, z: 480 }, 1800).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1800).easing(TWEEN.Easing.Cubic.Out).start();
        }

        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedValueDisplay');
        let frameCounter = 0;

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();

            const speedFactor = parseFloat(speedSlider.value);
            speedDisplay.innerText = speedFactor.toFixed(2) + 'x';

            frameCounter++;
            jupOffset += 0.01 * speedFactor;

            if(frameCounter % 6 === 0 && speedFactor > 0) {
                updateSunTexture(); sunTexture.needsUpdate = true;
                updateJupiterTexture(); jupiterTexture.needsUpdate = true;
            }

            Object.keys(celestialObjects).forEach(key => {
                const obj = celestialObjects[key];
                if(!isAligned && obj.pivot) obj.pivot.rotation.y += obj.speed * speedFactor;
                if(obj.mesh && !obj.mesh.isGroup) {
                    obj.mesh.rotation.y += 0.005 * speedFactor;
                    const clouds = obj.mesh.getObjectByName("EarthClouds");
                    if(clouds) clouds.rotation.y += 0.008 * speedFactor;
                }
            });

            if (neutronGroup) neutronGroup.rotation.y += 0.12 * speedFactor;
            if (acrDisk) acrDisk.rotation.z += 0.03 * speedFactor;
            if (milkyWayGroup) milkyWayGroup.rotation.y += 0.0012 * speedFactor;
            if (andromedaGroup) andromedaGroup.rotation.y += 0.0009 * speedFactor;

            if(selectedObject && celestialObjects[selectedObject]) {
                const targetPos = new THREE.Vector3();
                if(selectedObject === "AsteroidBelt" && celestialObjects["AsteroidBelt"].centerAnchor) {
                    celestialObjects["AsteroidBelt"].centerAnchor.getWorldPosition(targetPos);
                } else if(celestialObjects[selectedObject].mesh) {
                    celestialObjects[selectedObject].mesh.getWorldPosition(targetPos);
                }
                
                const currentCenter = controls.target;
                const moveDelta = targetPos.clone().sub(currentCenter);
                controls.target.copy(targetPos);
                camera.position.add(moveDelta);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
